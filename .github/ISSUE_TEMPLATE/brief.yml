name: Brief
description: A well-defined task for an agent session to implement unattended.
body:
  - type: markdown
    attributes:
      value: |
        `implement` starts an agent session for this brief once it has the
        `agent:queued` label. Leave the label off while the brief is a draft.
        See [decision 0014](https://github.com/danschultz/agent-diff/blob/main/docs/decisions/0014-implement-briefs-headlessly.md).
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome to deliver.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: A hard boundary. Needing to cross it is a reason to escalate.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background, links, and files to read first.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Each one is checked and reported as met or not met in the pull request.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Steps the agent session runs. Their results are reported in the pull request.
    validations:
      required: true
  - type: textarea
    id: escalation-criteria
    attributes:
      label: Escalation criteria
      description: Situations where the agent session stops and asks Dan instead of deciding alone.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else.
