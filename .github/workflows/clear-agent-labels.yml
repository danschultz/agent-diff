# Removes the agent:* labels from a brief's issue when it's closed, so closed
# issues don't keep a stale state like agent:review. See decision 0015.
name: Clear agent labels

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  clear:
    if: contains(join(github.event.issue.labels.*.name, ' '), 'agent:')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          args=()
          while IFS= read -r label; do
            args+=(--remove-label "$label")
          done < <(jq -r '.[] | select(startswith("agent:"))' <<<"$LABELS")
          if [ ${#args[@]} -gt 0 ]; then
            gh issue edit "$ISSUE" "${args[@]}"
          fi
